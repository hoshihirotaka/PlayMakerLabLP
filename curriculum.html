    <!-- JSON-LD（Event / Organization）は schedule.html にのみ置く。
         構造化データは日程が実際に載っているページと一致させる必要がある。
         2026-08-25、このページにも Event が入ったままだったのを削除した
         （同じイベントを3ページが宣言している状態だった）。 -->
    <!-- Google tag (gtag.js) — GA4 と Google広告 をまとめて即時読み込み
         以前はGA4だけ window.load 後に読み込んでいたが、全画像の読み込み完了を待つため
         モバイルで数秒遅れ、早期離脱がまるごと計測から漏れていた。エンゲージメント時間も
         実態より短く出る。計測の起点を早めるため、通常のasync読み込みに戻している。 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-E9YKGSCX5B"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag("js", new Date());
      gtag("config", "G-E9YKGSCX5B");
      gtag("config", "AW-977501883");
    </script>

    <!-- Metaピクセル。
         これが無いとMetaは「広告をクリックした人がLPを開いたか」を知れず、
         ランディングページビュー（LPV）が測れない。LPV単価をクリエイティブの
         比較基準にしているので、その土台にあたる。

         ⚠️ 申込（doorkeeper_click）を最適化の目標にしないこと。
         Metaの学習に必要な件数に対して、こちらの実績は大きく足りない。
         信号が薄いと配信が絞られる（8/18にGoogle広告で起きたのと同じ）。
         最適化に使うならLPVまで。件数は ~/curriculum 側を見ること。 -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window,document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '2014627915461616');
      fbq('track', 'PageView');
    </script>

      .curriculum-visual .curriculum-key { margin: 0 0 16px; display: grid; gap: 4px; padding: 10px 14px; border-radius: 14px; background: #f1f8fa; }
      .curriculum-visual .curriculum-key > div { display: grid; grid-template-columns: 24px 9em 1fr; gap: 8px; align-items: center; }

      @media (max-width: 640px) {
