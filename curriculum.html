    <!-- JSON-LD（Event / Organization）は schedule.html にのみ置く。
         構造化データは日程が実際に載っているページと一致させる必要がある。
         2026-08-25、このページにも Event が入ったままだったのを削除した
         （同じイベントを3ページが宣言している状態だった）。 -->
    <!-- Google tag (gtag.js) — GA4 と Google広告 をまとめて即時読み込み
         以前はGA4だけ window.load 後に読み込んでいたが、全画像の読み込み完了を待つため
         モバイルで数秒遅れ、早期離脱がまるごと計測から漏れていた。エンゲージメント時間も
         実態より短く出る。計測の起点を早めるため、通常のasync読み込みに戻している。 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-E9YKGSCX5B"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag("js", new Date());
      gtag("config", "G-E9YKGSCX5B");
      gtag("config", "AW-977501883");
    </script>

    <!-- Metaピクセル。
         これが無いとMetaは「広告をクリックした人がLPを開いたか」を知れず、
         ランディングページビュー（LPV）が測れない。LPV単価をクリエイティブの
         比較基準にしているので、その土台にあたる。

         ⚠️ 申込（doorkeeper_click）を最適化の目標にしないこと。
         Metaの学習は1広告セットあたり週50件が目安で、実績は週2〜3件。
         信号が薄いと配信が絞られる（8/18にGoogle広告で起きたのと同じ）。
         最適化に使うならLPVまで。 -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window,document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '2014627915461616');
      fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none" alt=""
      src="https://www.facebook.com/tr?id=2014627915461616&ev=PageView&noscript=1" /></noscript>
